/* ============================================================================
   THE CAFÉ HANDSHAKE — dark arcade restyle
   The retro comes from the room: phosphor lines on near-black, scanlines,
   glow, vignette. It never comes from the typography, which stays modern,
   quiet and highly legible so the story can actually be read.
   ========================================================================== */

:root{
  --chrome:432px;
  --ar:1.43;

  /* --- ground --- */
  --void:#06090a;        /* the page */
  --room:#0a1012;        /* the stage behind everything */
  --wall:#0d1517;
  --floor:#090f10;
  --surface:#111b1d;     /* dialogue panels, cards */
  --surface-2:#162224;
  --glass:#0b1614;       /* laptop screens — items glow on this */
  --lid:#1b282b;         /* the machine, solid enough to have a silhouette */
  --deck:#141f21;

  /* --- line work: phosphor, not ink --- */
  --outline:#93b9ad;     /* every mid-ground and item stroke */
  --bg-line:#2c443e;     /* scenery, one step back */
  --line:#1d2a29;
  --edge:#31443f;

  /* --- type --- */
  --ink:#e9f4ef;
  --ink-2:#93aaa3;
  --ink-3:#65807a;

  /* --- meaning: one job per hue --- */
  --maya:#5b8cff;        /* Maya, and anything of hers */
  --leo:#b57cff;         /* Leo, and anything of his */
  --key:#42f08c;         /* the system: the shared key and encryption */
  --danger:#ff4d7e;      /* Evan, and what he can see */

  --maya-soft:#1b2b4d;
  --leo-soft:#2e2148;
  --key-soft:#123a28;
  --danger-soft:#3d1626;

  --glow-key:rgba(66,240,140,.42);
  --glow-danger:rgba(255,77,126,.38);

  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --cam-ease:cubic-bezier(.62,0,.3,1);
  --cam-ms:1000ms;
}
@media (max-width:879px){ :root{--chrome:396px} }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--key);outline-offset:3px;border-radius:8px}

/* ---------------------------------------------------------------- shell -- */
.page{max-width:1120px;margin:0 auto;padding:36px 20px 128px}
@media (min-width:880px){ .page{padding:44px 32px 136px} }

.head{display:flex;flex-direction:column;gap:14px}
.pips{margin-top:14px;margin-bottom:26px}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
.h1{
  font-weight:600;
  font-size:clamp(23px,3.2vw,31px);
  line-height:1.22;letter-spacing:-.015em;
  margin:0;max-width:22ch;
  text-wrap:balance;
}

/* --- chapter markers: three, not five --- */
.pips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pip{
  display:flex;align-items:center;gap:9px;
  padding:6px 14px 6px 11px;border-radius:999px;
  border:1px solid var(--line);
  color:var(--ink-3);font-size:13.5px;font-weight:500;
  transition:color .3s ease,border-color .3s ease,background .3s ease;
}
.pip .dot{
  width:7px;height:7px;border-radius:50%;background:var(--edge);
  transition:background .3s ease,box-shadow .3s ease;
}
.pip[data-on="done"]{color:var(--ink-2)}
.pip[data-on="done"] .dot{background:var(--ink-3)}
.pip[data-on="now"]{color:var(--ink);border-color:var(--key);background:var(--key-soft)}
.pip[data-on="now"] .dot{background:var(--key);box-shadow:0 0 10px var(--glow-key)}

/* ---------------------------------------------------------------- stage -- */
.stage{
  position:relative;
  width:100%;
  max-width:calc((100dvh - var(--chrome)) * var(--ar));
  margin:0 auto;
  border:1px solid var(--edge);
  border-radius:14px;
  overflow:hidden;
  background:var(--room);
  box-shadow:0 0 0 1px rgba(66,240,140,.06), 0 24px 70px rgba(0,0,0,.6);
}
.stage svg{width:100%;height:auto;display:block}

/* CRT dressing. Deliberately faint: it sets the mood and then gets out of
   the way of anything anyone has to read. */
.crt{position:absolute;inset:0;pointer-events:none}
.crt.lines{
  background:repeating-linear-gradient(
    to bottom, rgba(0,0,0,.5) 0 1px, transparent 1px 3px);
  opacity:.16;mix-blend-mode:multiply;
}
.crt.vig{
  background:radial-gradient(120% 90% at 50% 45%,
    transparent 40%, rgba(0,0,0,.5) 100%);
}
.crt.bloom{
  background:radial-gradient(70% 55% at 50% 42%,
    rgba(66,240,140,.045), transparent 70%);
}

/* The camera. CSS transforms on SVG need real units — translate(28,-528) is
   valid SVG attribute syntax and invalid CSS, dropped silently. */
.cam{
  transform-box:view-box;transform-origin:0 0;
  transition:transform var(--cam-ms) var(--cam-ease);
}
/* Constant device size at any zoom; same curve as the camera. */
.hold{
  transform-box:fill-box;transform-origin:50% 50%;
  transition:transform var(--cam-ms) var(--cam-ease);
}

/* --- focus falloff: one focal point per shot --- */
.actor{transition:opacity .55s ease}
.actor.far{opacity:.15}
.actor.near{opacity:1}

/* ---------------------------------------------------------- drawing kit -- */
.ln{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ln-thin{fill:none;stroke:var(--outline);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.bg-ln{fill:none;stroke:var(--bg-line);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sh{fill:#000;opacity:.45}
.tile{fill:none;stroke:var(--bg-line);stroke-width:1;opacity:.5}

.wall-fill{fill:var(--wall)}
.floor-fill{fill:var(--floor)}
.furn{fill:var(--surface)}
.furn-2{fill:#0f1719}
.glass{fill:var(--glass)}
/* Solid bodies, so a laptop is an object rather than an outline that
   disappears into a dark room. */
.lid-fill{fill:var(--lid)}
.deck-fill{fill:var(--deck)}
.lid-fill.flash{animation:lidglow 900ms var(--cam-ease)}
@keyframes lidglow{0%{fill:var(--lid)}26%{fill:#1d3a2c}100%{fill:var(--lid)}}
.paper{fill:var(--surface)}
.ink{fill:var(--outline)}

.f-you{fill:var(--maya)}
.f-fr{fill:var(--leo)}
.f-key{fill:var(--key)}
.f-danger{fill:var(--danger)}
.f-you-s{fill:var(--maya-soft)}
.f-fr-s{fill:var(--leo-soft)}
.f-key-s{fill:var(--key-soft)}
.f-neutral{fill:var(--surface-2)}

/* phosphor bloom, only on the things that mean something */
.glowed{filter:drop-shadow(0 0 5px var(--glow-key))}
.glowed-d{filter:drop-shadow(0 0 5px var(--glow-danger))}

/* --- type inside the scene: sentence case, no pixel fonts, no tiny HUD --- */
.nameplate{
  font-family:var(--sans);font-weight:600;font-size:15px;
  fill:var(--ink);text-anchor:middle;letter-spacing:-.01em;
}
/* subordinate to the name, but still easy to scan */
.statelabel{
  font-family:var(--sans);font-weight:500;font-size:11.5px;
  fill:var(--ink-3);text-anchor:middle;letter-spacing:.02em;
}
.statelabel.danger{fill:var(--danger);opacity:.85}
/* the icon never carries the meaning alone */
.screencap{
  font-family:var(--sans);font-weight:500;font-size:7px;
  fill:var(--ink-3);text-anchor:middle;letter-spacing:.03em;
}
/* On-screen message text. Centred in the bubble and sized so it survives the
   close-up the camera moves for, without outgrowing the glass. */
.cipher{font-family:var(--mono);font-weight:500;font-size:7.5px;fill:var(--key);text-anchor:middle}
.wire{font-family:var(--mono);font-weight:500;font-size:7.5px;fill:var(--ink);text-anchor:middle}
.dlg-text{font-family:var(--sans);font-weight:500;font-size:15px;fill:var(--ink)}
.dlg-tag{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.01em}
.chip-text{font-family:var(--sans);font-weight:500;font-size:13.5px;fill:var(--ink-2)}
.chip-halo{
  font-family:var(--sans);font-weight:500;font-size:13.5px;
  fill:none;stroke:var(--room);stroke-width:6;stroke-linejoin:round;
}

/* ------------------------------------------------------- flight cards --- */
/* The payload, not the route. Same size at any zoom, so a viewer can always
   read what is crossing the room. */
.fly-shade{fill:var(--void);opacity:.82}
.fly-panel{fill:var(--surface);stroke-width:1.5}
.fly-panel.t-you{stroke:var(--maya)}
.fly-panel.t-fr{stroke:var(--leo)}
.fly-panel.t-key{stroke:var(--key)}
.fly-panel.t-danger{stroke:var(--danger)}
.fly-panel.t-neutral{stroke:var(--edge)}
.fly-ico{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fly-ico.t-you{stroke:var(--maya)}
.fly-ico.t-fr{stroke:var(--leo)}
.fly-ico.t-key{stroke:var(--key)}
.fly-ico.t-neutral{stroke:var(--ink-2)}
.fly-label{font-family:var(--sans);font-weight:600;font-size:13px;fill:var(--ink)}
.fly-sub{font-family:var(--sans);font-weight:500;font-size:10.5px;fill:var(--ink-2)}
.fly-sub.mono{font-family:var(--mono);font-size:10px;fill:var(--key)}
.fly{filter:drop-shadow(0 4px 14px rgba(0,0,0,.75))}

/* A swap on a screen should read as one object changing state. */
@keyframes morphpass{
  0%{opacity:1;transform:scaleX(1)}
  45%{opacity:.35;transform:scaleX(.82)}
  100%{opacity:1;transform:scaleX(1)}
}
.morphing{transform-box:fill-box;transform-origin:50% 50%;animation:morphpass 620ms var(--cam-ease)}

/* --------------------------------------------------------- the intruder --- */
/* Evan sits in the same room and is drawn in the same system, but every
   choice pushes the other way: angular instead of round, shadowed instead of
   lit, and a screen that looks like it is reading rather than working. */
.actor.hostile .ln{stroke:#c98a9c}
.actor.hostile .ln-thin{stroke:#c98a9c;opacity:.6}
.face-dark{fill:#1a1013}
.glass-hostile{fill:#1a0d12}
.eye-hard{
  fill:none;stroke:var(--danger);stroke-width:2.6;stroke-linecap:round;
  filter:drop-shadow(0 0 5px var(--glow-danger));
}
.scanline{fill:var(--danger);opacity:.5;animation:scan 2.6s linear infinite}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(47px)}}
.eye-pulse{
  fill:none;stroke:var(--danger);stroke-width:1.6;opacity:.5;
  animation:pulse 1.7s var(--cam-ease) infinite;
}
@keyframes pulse{
  0%{r:12;opacity:.65}
  100%{r:26;opacity:0}
}
/* he sits in a darker pocket of the room */
.actor.hostile .sh{opacity:.7}

/* --------------------------------------------------- connector grammar --- */
.link{fill:none;stroke:var(--outline);stroke-width:1.6;opacity:.16;stroke-linecap:round}
.ghostpath{fill:none;stroke:none}

.flow{fill:none;stroke-width:3.4;stroke-linecap:round;opacity:.95}
.flow.tone-you{stroke:var(--maya);filter:drop-shadow(0 0 5px rgba(91,140,255,.45))}
.flow.tone-fr{stroke:var(--leo);filter:drop-shadow(0 0 5px rgba(181,124,255,.45))}
.flow.tone-key{stroke:var(--key);filter:drop-shadow(0 0 5px var(--glow-key))}
.flow.tone-danger{stroke:var(--danger)}
.flow.fwd{stroke-dasharray:34 3000;animation:flowFwd 1.5s linear infinite}
.flow.rev{stroke-dasharray:34 3000;animation:flowRev 1.5s linear infinite}
@keyframes flowFwd{from{stroke-dashoffset:3034}to{stroke-dashoffset:0}}
@keyframes flowRev{from{stroke-dashoffset:-3034}to{stroke-dashoffset:0}}

.sight{
  fill:none;stroke:var(--danger);stroke-width:2;
  stroke-dasharray:5 7;stroke-linecap:round;opacity:.9;
  filter:drop-shadow(0 0 5px var(--glow-danger));
}
.leader line{stroke:var(--outline);opacity:.32}
.leader circle{fill:none;stroke:var(--outline);opacity:.32}
.leader{fill:none;stroke-linecap:round}

.arw{stroke:none}
.arw-you{fill:var(--maya)}
.arw-fr{fill:var(--leo)}
.arw-key{fill:var(--key)}
.arw-danger{fill:var(--danger)}

.eye{opacity:0;transition:opacity .4s ease}
.eye.on{opacity:1}

/* The one moment the world reacts: both laptops reach the key together. */
@keyframes goldflash{
  0%{stroke:var(--outline);stroke-width:2.2}
  26%{stroke:var(--key);stroke-width:3.6}
  100%{stroke:var(--outline);stroke-width:2.2}
}
.lid.flash{animation:goldflash 900ms var(--cam-ease)}

/* ------------------------------------------------------- key frames --- */
/* An intertitle, not a modal: no box, no border, just the room falling out
   of focus behind one sentence and one picture. */
.stage.frozen svg{filter:blur(8px) saturate(.45) brightness(.42)}
/* The opening card leans on the room as its picture, so it softens rather
   than obliterates: you should still be able to pick out who is who. */
/* The room is dark line-art already, so dimming it would erase the very
   imagery this card depends on. It brightens slightly instead, and the
   sentence wins on scrim and shadow rather than on darkness. */
.stage.frozen.soft svg{filter:blur(2.4px) saturate(.9) brightness(1.35)}
.stage svg{transition:filter .5s var(--cam-ease)}
.stage.frozen .flow{animation-play-state:paused}
.stage.frozen .crt.bloom{opacity:.4}

.kf{
  position:absolute;inset:0;z-index:6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(20px,3.4vh,38px);
  padding:6% 7%;
  opacity:0;pointer-events:none;
  transition:opacity .48s var(--cam-ease);
}
.kf.on{opacity:1}
.kf-img{width:100%;max-width:min(560px,86%);}
.kf-art{width:100%;height:auto;overflow:visible}
.kf-line{
  margin:0;text-align:center;text-wrap:balance;
  font-weight:600;letter-spacing:-.02em;line-height:1.18;
  font-size:clamp(21px,3.4vw + 8px,42px);
  max-width:17ch;color:var(--ink);
}
/* with no artwork above it the sentence carries the whole frame */
.kf-line.lead{
  font-size:clamp(24px,4.2vw + 9px,50px);
  max-width:20ch;line-height:1.14;
  text-shadow:0 2px 26px rgba(6,9,10,.95), 0 0 60px rgba(6,9,10,.85);
}
.kf.soft{background:radial-gradient(72% 62% at 50% 50%,rgba(6,9,10,.62),rgba(6,9,10,.14))}

/* imagery borrowed from the room, drawn a little heavier so it reads big */
.kf-ln{fill:none;stroke:var(--outline);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.kf-ln.lit{stroke:var(--key);filter:drop-shadow(0 0 8px var(--glow-key))}
.kf-glass{fill:var(--glass)}
.kf-void{stroke:var(--edge);stroke-width:2;stroke-dasharray:3 7}
.kf-tie{stroke:var(--key);stroke-width:2;opacity:.5;stroke-dasharray:3 7}
.kf-route{fill:none;stroke:var(--outline);stroke-width:2;opacity:.28;stroke-dasharray:5 8}
.kf-arrow{fill:none;stroke:var(--key);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kf-card{fill:var(--surface);stroke-width:1.6}
.kf-card.t-you{stroke:var(--maya)}
.kf-card-t{font-family:var(--sans);font-weight:600;font-size:15px;fill:var(--ink);text-anchor:middle}
.kf-ico{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kf-ico.t-you{stroke:var(--maya)}
.kf-plus{font-family:var(--sans);font-weight:600;font-size:15px;fill:var(--ink-2);text-anchor:middle}
.kf-glow{filter:drop-shadow(0 0 9px var(--glow-key))}

/* ------------------------------------------------------------ subtitle --- */
/* The narrator layer. One short line, always in the same place, so the eye
   never hunts for it. Modern type, generous height, sentence case. */
.sub{
  min-height:64px;
  display:flex;align-items:center;justify-content:center;
  margin:20px auto 0;max-width:44ch;padding:0 4px;
  text-align:center;
}
.sub-in{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:opacity .28s ease,transform .28s ease;
}
.sub-in.swap{opacity:0;transform:translateY(4px)}
.sub .term{
  font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--key);
}
.sub p{
  margin:0;font-size:clamp(16px,1.1vw + 12px,19px);
  font-weight:500;line-height:1.45;letter-spacing:-.005em;
  color:var(--ink);text-wrap:balance;
}

/* --------------------------------------------------------------- nav ----- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:linear-gradient(to top,var(--void) 62%,rgba(6,9,10,0));
  padding:22px 20px calc(20px + env(safe-area-inset-bottom));
}
.nav-in{
  max-width:1120px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:50px;padding:0 26px;border-radius:10px;
  font-family:var(--sans);font-weight:600;font-size:15.5px;letter-spacing:-.005em;
  border:1px solid var(--edge);background:var(--surface);color:var(--ink);
  transition:border-color .2s ease,background .2s ease,box-shadow .2s ease,opacity .2s ease;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{
  border-color:var(--key);color:var(--key);background:var(--key-soft);
  box-shadow:0 0 22px rgba(66,240,140,.16);
}
.btn.primary:hover{box-shadow:0 0 30px rgba(66,240,140,.26)}
.btn.ghost{border-color:transparent;color:var(--ink-3)}
.btn.ghost:hover{color:var(--ink-2)}
.btn[disabled]{opacity:.3;cursor:default}
.btn .ct{font-family:var(--mono);font-size:11.5px;opacity:.6;font-weight:400}

/* playing: the primary control steps back rather than vanishing */
.btn.primary.waiting{opacity:.34;pointer-events:none;box-shadow:none}

/* --------------------------------------------------------------- below --- */
.read{margin:44px auto 0;max-width:64ch;display:flex;flex-direction:column;gap:10px}
.read h2{
  font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 2px;
}
.read p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.75}

/* ============================================================ MOBILE ==== */
/* Below tablet width the priority order changes: watch the story, then
   understand it, then navigate. The animation leads and takes most of the
   first screen; the title, the copy and the chapter nav follow it. Tablet and
   up are untouched. */
@media (max-width:767px){
  :root{--chrome:152px}

  .page{
    display:flex;flex-direction:column;
    padding:14px 16px 132px;
    gap:0;
  }
  .stage{order:1}
  .sub  {order:2;margin-top:18px;min-height:0}
  .head {order:3;margin-top:16px;gap:8px}
  .pips {order:4;margin-top:18px;margin-bottom:0}
  .read {order:5;margin-top:34px}

  /* the eyebrow is chrome; on a phone the title says the same thing and the
     chapter nav needs the room to clear the fixed control bar */
  .eyebrow{display:none}

  /* the sentence under the animation is the explanation, so it leads the
     copy block; the chapter title sits under it as context */
  .sub p{font-size:clamp(17px,4.4vw,20px)}
  .h1{font-size:19px;line-height:1.3;max-width:34ch;font-weight:500;color:var(--ink-2)}
  .eyebrow{font-size:10.5px}

  /* touch targets with room between them */
  .pips{gap:10px}
  .pip{min-height:44px;padding:0 16px 0 13px;font-size:14px}
  .nav{padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
  .nav-in{gap:12px}
  .btn{min-height:48px}
}

@media (prefers-reduced-motion:reduce){
  .cam,.hold,.actor,.sub p{transition-duration:1ms}
  .flow.fwd,.flow.rev{animation:none;stroke-dasharray:none}
  .morphing{animation:none}
  .scanline,.eye-pulse{animation:none}
  .stage svg,.kf{transition-duration:1ms}
  .lid.flash{animation:none}
}

</style>
